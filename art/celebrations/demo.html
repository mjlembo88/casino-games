<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marcus's Table: celebration effects demo (play money)</title>
<style>
  html,body{margin:0;height:100%;background:#073d22;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;color:#fff8e7;overflow:hidden}
  #table{position:absolute;inset:0}
  #felt{position:absolute;inset:0;width:100%;height:100%}
  .hand{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:calc(14px*var(--k))}
  #dealer{top:7%} #player{top:56%}
  .card{width:calc(110px*var(--k));height:calc(154px*var(--k));border-radius:calc(7px*var(--k));background:linear-gradient(160deg,#fffdf6,#f7f3ea 60%,#ece5d3);box-shadow:0 6px 14px rgba(0,0,0,.45);position:relative}
  .card .ix{position:absolute;left:8%;top:5%;font:700 calc(30px*var(--k)) Georgia,"Times New Roman",serif;line-height:1;text-align:center}
  .card .ix svg{display:block;width:calc(20px*var(--k));height:calc(20px*var(--k));margin:calc(3px*var(--k)) auto 0}
  .card .big{position:absolute;left:50%;top:54%;width:46%;transform:translate(-50%,-50%)}
  .card.back{background:#8a0d22;border:calc(5px*var(--k)) solid #f7f3ea;box-sizing:border-box;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px),repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 6px,transparent 6px 14px)}
  #bet{position:absolute;left:50%;top:86%;width:calc(120px*var(--k));height:calc(120px*var(--k));transform:translate(-50%,-50%);border-radius:50%;border:calc(2px*var(--k)) dashed rgba(242,193,78,.7);box-shadow:inset 0 0 0 calc(6px*var(--k)) rgba(255,240,200,.08)}
  .chip{position:absolute;left:50%;width:calc(64px*var(--k));height:calc(64px*var(--k));margin-left:calc(-32px*var(--k));filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
  #ui{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;padding:10px;flex-wrap:wrap;z-index:100;align-items:center}
  #ui button{min-height:44px;padding:0 16px;border-radius:14px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(#f2c14e,#c89527);color:#121212;box-shadow:0 3px 0 #7a5a14}
  #ui button:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5a14}
  #ui label{font-size:14px;color:rgba(255,248,231,.85);display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.25);padding:6px 10px;border-radius:10px}
  .capture #ui{display:none}
  #stats{position:absolute;right:10px;bottom:8px;font:12px ui-monospace,Menlo,monospace;color:rgba(255,248,231,.55);z-index:100}
  .capture #stats{display:none}
</style></head>

</div>

  <label><input type="checkbox" id="rm"> reduce motion</label>
  <label><input type="checkbox" id="snd"> sound</label>

</div>
